name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 319504a5326aa870edde46438c5455fa76305a56

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            triplet: x64-linux
            deploy_target: ''
            package_name: evnova-linux-x64
          - name: macOS
            runner: macos-15
            triplet: arm64-osx
            deploy_target: 11.0
            package_name: evnova-macos-arm64
          - name: Windows
            runner: windows-2022
            triplet: x64-windows
            deploy_target: ''
            package_name: evnova-windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore pinned vcpkg environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg"

      - name: Install Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libegl1-mesa-dev libibus-1.0-dev libwayland-dev libx11-dev \
            libxext-dev libxft-dev libxkbcommon-dev

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          # The primary key must encode the full build configuration: vcpkg folds
          # the triplet (and its overlay settings such as the macOS deployment
          # target) into each port's ABI hash, so a config change means the old
          # entries no longer match. Without this the primary key still hits, the
          # save step is skipped, and every run silently rebuilds every port.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ matrix.deploy_target }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-binary-cache

      - name: Prepare the vcpkg triplet overlay
        shell: bash
        run: |
          # vcpkg accepts a macOS deployment target only through a triplet, and the
          # project keeps no project-local triplet (vcpkg's arm64-osx already links
          # statically). Generate one here so the distribution build targets arm64's
          # floor of 11.0 instead of the runner's SDK.
          mkdir -p ci-triplets
          if [[ -n "${{ matrix.deploy_target }}" ]]; then
          cat > "ci-triplets/${{ matrix.triplet }}.cmake" <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
          set(VCPKG_OSX_ARCHITECTURES arm64)
          set(VCPKG_OSX_DEPLOYMENT_TARGET "${{ matrix.deploy_target }}")
          EOF
          fi

      - name: Install manifest dependencies
        shell: bash
        run: ./vcpkg/vcpkg install --x-manifest-root=. --triplet "${{ matrix.triplet }}" --overlay-triplets=ci-triplets

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ matrix.deploy_target }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}

      - name: Add vcpkg DLLs to the Windows test path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed\x64-windows\bin'
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory was not found: $vcpkgBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $vcpkgBin

      - name: Configure
        run: cmake --preset release -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_OVERLAY_TRIPLETS=ci-triplets -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deploy_target }}

      - name: Build
        run: cmake --build --preset release --parallel -- -k 0

      # Tests share a few deliberately fixed temporary paths, so keep the
      # single Catch2 process serial. Archive-backed cases require local data.
      - name: Run hermetic tests
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test_exe="build/release/tests/evnova_tests.exe"
          else
            test_exe="build/release/tests/evnova_tests"
          fi
          "$test_exe" --filenames-as-tags \
            '[#collision_test],[#command_input_test],[#flight_automation_test],[#impact_effects_test],[#mission_script_test]~"mission payload context expands Q message text tags",[#movement_test],[#nova_command_test],[#nova_font_test],[#outfit_clamp_test],[#outfit_ionization_test],[#placement_test],[#render_clip_scope_test],[#sdl_audio_test],[#services_buttons_test],[#ship_visual_test],[#spaceflight_player_state_test],[#sprite_test]' \
            --reporter console --verbosity quiet

      # The Windows build links vcpkg's dynamic triplet, so bundle its runtime
      # DLLs beside the executable. macOS links statically. Linux ships no
      # binary: the glibc floor of the runner would exclude older distros, so
      # Linux users build from source instead.
      - name: Package
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ matrix.package_name }}"
          rm -rf dist
          mkdir -p "dist/$pkg"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/release/src/evnova.exe "dist/$pkg/"
            cp vcpkg_installed/${{ matrix.triplet }}/bin/*.dll "dist/$pkg/"
            (cd dist && 7z a "$pkg.zip" "$pkg" >/dev/null)
          else
            cp build/release/src/evnova "dist/$pkg/"
            chmod +x "dist/$pkg/evnova"
            (cd dist && tar -czf "$pkg.tar.gz" "$pkg")
          fi
          ls -l dist

      - name: Upload package
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}.*
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    name: Publish latest-nightly
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish latest-nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-nightly
          name: Latest nightly
          prerelease: true
          body: |
            Automated nightly build of `main`, refreshed on every green CI run.

            These builds are untested snapshots of an in-progress reimplementation
            and are not signed.

            **macOS:** the build is unsigned and targets Apple Silicon only. After
            extracting, clear the quarantine flag before running:

            ```
            xattr -dr com.apple.quarantine evnova-macos-arm64
            ```

            **Linux:** no prebuilt binary is provided. Clone the repository and
            build from source (the `release` CMake preset installs dependencies via
            vcpkg).

            Assets:
            - `evnova-macos-arm64.tar.gz`
            - `evnova-windows-x64.zip`
          files: dist/*
          fail_on_unmatched_files: true
