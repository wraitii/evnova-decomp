name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 319504a5326aa870edde46438c5455fa76305a56

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            triplet: x64-linux
            deploy_target: ''
            package_name: evnova-linux-x64
          - name: macOS
            runner: macos-15
            triplet: arm64-osx
            deploy_target: 11.0
            package_name: evnova-macos-arm64
          - name: Windows
            runner: windows-2022
            triplet: x64-windows-static
            deploy_target: ''
            package_name: evnova-windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore pinned vcpkg environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg"

      - name: Install Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libegl1-mesa-dev libibus-1.0-dev libwayland-dev libx11-dev \
            libxext-dev libxft-dev libxkbcommon-dev

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          # The primary key encodes the full build configuration because vcpkg
          # folds the triplet (and overlay settings such as the macOS deployment
          # target) into each port's ABI hash. If the key omitted them, a config
          # change would produce a primary-key hit, skip the save step, and force
          # a full rebuild on every run.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ matrix.deploy_target }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-binary-cache

      - name: Prepare the vcpkg triplet overlay
        shell: bash
        run: |
          # vcpkg accepts a macOS deployment target only through a triplet, and the
          # project keeps no project-local triplet (vcpkg's arm64-osx already links
          # statically). Generate one here so the distribution build targets arm64's
          # floor of 11.0 instead of the runner's SDK.
          mkdir -p ci-triplets
          if [[ -n "${{ matrix.deploy_target }}" ]]; then
          cat > "ci-triplets/${{ matrix.triplet }}.cmake" <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
          set(VCPKG_OSX_ARCHITECTURES arm64)
          set(VCPKG_OSX_DEPLOYMENT_TARGET "${{ matrix.deploy_target }}")
          EOF
          fi

      - name: Install manifest dependencies
        shell: bash
        run: ./vcpkg/vcpkg install --x-manifest-root=. --triplet "${{ matrix.triplet }}" --overlay-triplets=ci-triplets

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ matrix.deploy_target }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: cmake --preset release -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_OVERLAY_TRIPLETS=ci-triplets -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deploy_target }}

      - name: Build
        run: cmake --build --preset release --parallel -- -k 0

      # Tests share a few deliberately fixed temporary paths, so keep the
      # single Catch2 process serial. Archive-backed cases require local data.
      - name: Run hermetic tests
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test_exe="build/release/tests/evnova_tests.exe"
          else
            test_exe="build/release/tests/evnova_tests"
          fi
          "$test_exe" --filenames-as-tags \
            '[#collision_test],[#command_input_test],[#flight_automation_test],[#impact_effects_test],[#mission_script_test]~"mission payload context expands Q message text tags",[#movement_test],[#nova_command_test],[#nova_font_test],[#outfit_clamp_test],[#outfit_ionization_test],[#placement_test],[#render_clip_scope_test],[#sdl_audio_test],[#services_buttons_test],[#ship_visual_test],[#spaceflight_player_state_test],[#sprite_test]' \
            --reporter console --verbosity quiet

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.package_name }}"
          cp build/release/src/evnova.exe "dist/${{ matrix.package_name }}/"
          (cd dist && 7z a "${{ matrix.package_name }}.zip" "${{ matrix.package_name }}" >/dev/null)

      # Only trusted main builds receive signing credentials. Missing credentials
      # fail the release instead of silently publishing an unsigned nightly.
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID || 'io.github.wraitii.evnova-decomp' }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/evnova-signing.keychain-db"
          certificate="$RUNNER_TEMP/evnova-signing.p12"
          cleanup() {
            rm -f "$certificate"
            security delete-keychain "$keychain" || true
          }
          trap cleanup EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials evnova-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          python3 tools/package_macos.py \
            --identity "$MACOS_SIGNING_IDENTITY" --keychain "$keychain" \
            --notary-profile evnova-notary --bundle-id "$MACOS_BUNDLE_ID" \
            --build-number "$GITHUB_RUN_NUMBER" --output "dist/${{ matrix.package_name }}.zip"

      - name: Package macOS app for testing (ad hoc signature)
        if: runner.os == 'macOS' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        env:
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID || 'io.github.wraitii.evnova-decomp' }}
        run: >-
          python3 tools/package_macos.py
          --bundle-id "$MACOS_BUNDLE_ID" --build-number "$GITHUB_RUN_NUMBER"
          --output "dist/${{ matrix.package_name }}.zip"

      - name: Clean up macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/evnova-signing.p12"
          if [[ -f "$RUNNER_TEMP/evnova-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/evnova-signing.keychain-db"
          fi

      - name: Upload package
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}.*
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    name: Publish latest-nightly
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish latest-nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-nightly
          name: Latest nightly
          prerelease: true
          body: |
            Automated nightly build of `main`, refreshed on every green CI run.

            These builds are untested snapshots of an in-progress reimplementation.

            **macOS:** Developer ID signed and notarized, for Apple Silicon only.
            Extract the ZIP, move `EV Nova.app` to Applications, and open it.
            Select your original EV Nova game-data folder when prompted.
            Game data is not included. Windows builds are unsigned.

            **Linux:** no prebuilt binary is provided. Clone the repository and
            build from source (the `release` CMake preset installs dependencies via
            vcpkg).

            Assets:
            - `evnova-macos-arm64.zip`
            - `evnova-windows-x64.zip`
          files: dist/*
          fail_on_unmatched_files: true
