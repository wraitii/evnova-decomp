version = 1
name = "tutorial-reach-sol-porto-rillia"

[defaults]
timeout_ms = 30000

# Start-system branch for Porto Rillia (`.Trader` System3 = 0xaa). Land at
# Ryll's Federation spaceport, accept Barry's Tutorial 001 ("Head to Sol",
# mission 251 / template 123), then jump Porto Rillia -> Pollux ->
# Nesre Primus -> Sol. The Shuttle's full tank is exactly three jumps, so the
# route reaches Sol without an intermediate refuel. Once in Sol the
# `tutorial_reach_sol` dispatcher hands back to the normalized tutorial path.
[[steps]]
action = "command"
cmd = "land_at"
target = "Ryll"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "ui.window" = "mission_offer" }
timeout_ms = 180000

[[steps]]
action = "click"
element = "accept"

[[steps]]
action = "wait"
expect = { "missions.missions.0.template_id" = 123 }

[[steps]]
action = "validate_state"
expect = { "missions.missions.0.template_id" = 123, "missions.missions.0.return_stellar" = "Earth", "missions.missions.0.failed" = false }

[[steps]]
action = "wait"
expect = { "ui.window" = "text_reader" }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport" }

[[steps]]
action = "click"
element = "launch"

# The controller moves out of the center gate; gameplay owns the jump itself.
[[steps]]
action = "command"
cmd = "jump_to"
target = "Pollux"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Pollux" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "jump_to"
target = "Nesre Primus"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Nesre Primus" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "jump_to"
target = "Sol"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Sol" }
timeout_ms = 180000
