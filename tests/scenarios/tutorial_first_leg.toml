expect = { "state.system" = "Wolf 359", "state.active_missions" = 1, "missions.missions.0.template_id" = 503, "missions.missions.0.objective_complete" = true, "missions.missions.0.failed" = false }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport", "state.active_missions" = 0 }

[[steps]]
action = "click"
element = "refuel"

# Tutorial 004 returns the pilot to Earth. It has no initial briefing reader.
[[steps]]
action = "click"
element = "trade_center"

[[steps]]
action = "wait"
expect = { "ui.window" = "mission_offer" }

[[steps]]
action = "click"
element = "accept"

[[steps]]
action = "wait"
expect = { "missions.missions.0.template_id" = 504, "ui.window" = "trade_center" }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport" }

[[steps]]
action = "click"
element = "launch"

[[steps]]
action = "command"
cmd = "jump_to"
target = "Sol"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Sol" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "land_at"
target = "Earth"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "ui.window" = "text_reader" }
timeout_ms = 180000

[[steps]]
action = "validate_state"
expect = { "state.system" = "Sol", "state.active_missions" = 1, "missions.missions.0.template_id" = 504, "missions.missions.0.objective_complete" = true, "missions.missions.0.failed" = false }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport", "state.active_missions" = 0 }

[[steps]]
action = "click"
element = "refuel"

[[steps]]
action = "screenshot"
name = "trade-tutorial-complete"

# Tutorial 005 is offered when Barry sends the pilot into Earth's outfitter.
[[steps]]
action = "click"
element = "outfitter"

[[steps]]
action = "wait"
expect = { "ui.window" = "mission_offer" }

[[steps]]
action = "screenshot"
name = "outfitter-tutorial-offer"

[[steps]]
action = "click"
element = "accept"

[[steps]]
action = "wait"
expect = { "missions.missions.0.template_id" = 505, "ui.window" = "text_reader" }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "outfitter" }

[[steps]]
action = "click"
element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport" }

[[steps]]
action = "click"
element = "launch"

# Rautherion is reached from Sol through Nesre Primus and Arcturus.
[[steps]]
action = "command"
cmd = "jump_to"
target = "Nesre Primus"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Nesre Primus" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "jump_to"
target = "Arcturus"
timeout_ms = 180000

[[steps]]
action = "wait"
