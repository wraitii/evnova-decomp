element = "done"

[[steps]]
action = "wait"
expect = { "ui.window" = "spaceport", "state.active_missions" = 0 }

[[steps]]
action = "validate_state"
expect = { "state.system" = "Journey's End", "state.active_missions" = 0, "missions.missions" = [] }

[[steps]]
action = "screenshot"
name = "tutorial-008-complete"

[[steps]]
action = "quit"
