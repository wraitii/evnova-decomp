timeout_ms = 180000

[[steps]]
action = "command"
cmd = "jump_to"
target = "Rautherion"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Rautherion" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "land_at"
target = "Rauther"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "ui.window" = "text_reader" }
timeout_ms = 180000

[[steps]]
