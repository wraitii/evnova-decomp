[[steps]]
action = "command"
cmd = "jump_to"
target = "Wolf 359"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Wolf 359" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "land_at"
