[[steps]]
action = "command"
cmd = "jump_to"
target = "Nesre Primus"
timeout_ms = 180000

[[steps]]
action = "wait"
expect = { "automation.phase" = "complete", "state.system" = "Nesre Primus" }
timeout_ms = 180000

[[steps]]
action = "command"
cmd = "jump_to"
